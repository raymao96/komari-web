name: Publish dist release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Stable version tag, for example 2.3.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: dist-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name == 'workflow_dispatch' || (!github.event.release.prerelease && !startsWith(github.event.release.tag_name, 'Snapshot-')) }}
    steps:
      - name: Resolve tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG:-$INPUT_TAG}"
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must be a stable version, for example 2.3.0." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build system UI
        run: npm run build

      - name: Pack dist-release.zip
        run: python -c "import shutil; shutil.make_archive('dist-release', 'zip', 'dist')"

      - name: Upload dist-release.zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh release upload "$TAG" dist-release.zip --repo "$GITHUB_REPOSITORY" --clobber
